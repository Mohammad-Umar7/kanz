name: kanz
description: "Kanz: photograph household items and learn how to upcycle, recycle or donate them."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  camera: ^0.12.0+2
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  geolocator: ^14.1.1
  permission_handler: ^12.0.1
  google_maps_flutter: ^2.18.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.5
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  intl: ^0.20.2
  phosphor_flutter: ^2.1.0
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  collection: ^1.19.1
  uuid: ^4.6.0
  package_info_plus: ^10.2.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/map_styles/
    - assets/config/
    - assets/brand/
    - assets/fonts/licenses/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Light.ttf
          weight: 300
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
